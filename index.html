<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zahra's Dress-Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one-screen sticker-book dressing room. Tabs on top, the girl on a stage, chunky trays below (beside her on wide screens). */
:root{
  --ground:#FFE3D3;      /* peach play-mat */
  --card:#FFF9F3;        /* paper */
  --ink:#3B1F4A;         /* plum outlines */
  --pick:#FFC93C;        /* sunny "selected" */
  --pop:#FF5FA2;         /* pink accent */
  --soft:#F3D9CC;        /* muted peach */
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;max-width:1100px;margin:0 auto;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:var(--display);color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:18px;
  box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;padding:0;min-width:0;
  transition:transform .08s,box-shadow .08s,background .15s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--pop);outline-offset:3px}
button.on{background:var(--pick)}
button svg{display:block;margin:0 auto;pointer-events:none}

.top{display:flex;gap:8px}
.tab{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:800;line-height:1}
.tab svg{width:30px;height:30px}
.ib{flex:0 0 48px;height:58px}
.ib svg{width:26px;height:26px}

.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stagebox{flex:1;min-height:150px;border:4px solid var(--ink);border-radius:26px;overflow:hidden;background:var(--card);box-shadow:0 5px 0 var(--ink);position:relative}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.panel{position:relative;flex:0 0 auto;max-height:54%;overflow-y:auto;overflow-x:hidden;padding:2px 2px 8px}
.panel.quizzing{overflow:hidden;min-height:310px}
.rows{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:6px}
.cats{grid-template-columns:repeat(5,1fr)}
.chip{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:800;line-height:1}
.chip svg{width:32px;height:32px}
.items{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.it{height:60px}
.it svg{width:48px;height:48px}
.colors{grid-template-columns:repeat(10,1fr)}
.sw{height:44px;border-radius:999px}
.sw.on{transform:scale(1.08);box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.pats{grid-template-columns:repeat(7,1fr)}
.pt{height:48px}
.pt svg{width:36px;height:36px}
.tools{grid-template-columns:repeat(5,1fr)}
.tool{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:800;line-height:1}
.tool svg{width:32px;height:32px}
.off svg{width:28px;height:28px}
.big10{font-size:26px;font-weight:800}
@media (max-width:520px){.colors{grid-template-columns:repeat(5,1fr)}.sw{height:40px}}

/* questions */
.quiz{position:absolute;inset:0;z-index:5;background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 12px;box-sizing:border-box}
.qrow{display:flex;align-items:center;gap:10px;max-width:100%}
.qprompt{font-size:24px;font-weight:800;text-align:center;text-wrap:balance;line-height:1.1}
.qhear{flex:0 0 46px;height:46px;border-radius:50%}
.qhear svg{width:24px;height:24px}
.qvis{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:70px;max-width:100%}
.qvis svg.thing{width:96px;height:96px}
.qvis svg.cnt{width:42px;height:42px}
.tile{width:44px;height:52px;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;font-size:32px;font-weight:800;background:#fff}
.tile.q{background:var(--pick)}
.tile.e{border-style:dashed;color:transparent;background:transparent}
.qchoices{display:flex;gap:12px;justify-content:center}
.qchoices button{width:90px;height:90px;border-radius:24px;font-size:52px;font-weight:800;line-height:1}
.qchoices button svg{width:62px;height:62px}
.qchoices button.swc{border-radius:50%}
.qchoices button.word{font-size:22px;width:100px}
.qchoices button.no{animation:shake .4s;opacity:.35}
.qchoices button.hint{animation:pulse .9s ease-in-out infinite}
.qchoices button.yes{background:var(--pick);transform:scale(1.1)}
.qmic{height:52px;padding:0 20px;border-radius:30px;background:var(--pop);color:#fff;display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.qmic svg{width:26px;height:26px;margin:0}
.qmic.listening{animation:pulse .9s ease-in-out infinite;background:#36B65A}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{50%{transform:scale(1.1)}}

/* grown-up settings */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(59,31,74,.45);display:grid;place-items:center;padding:16px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:24px;padding:18px;max-width:420px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:24px}
.card p{margin:0;font-family:system-ui,sans-serif;font-size:14px;line-height:1.45;max-width:60ch}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:48px;font-size:17px;font-weight:800}
.lbl{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
#resetBtn.armed{background:var(--pop);color:#fff}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-30px;width:16px;height:16px;border-radius:4px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

@media (min-aspect-ratio:5/4) and (min-width:640px){
  .main{flex-direction:row}
  .panel{flex:0 0 min(460px,46%);max-height:none}
  .panel.quizzing{min-height:0}
  .chip{height:68px;font-size:14px}.chip svg{width:40px;height:40px}
  .items{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .it{height:78px}.it svg{width:62px;height:62px}
  .colors{grid-template-columns:repeat(5,1fr)}.sw{height:56px}
  .pt{height:58px}.pt svg{width:44px;height:44px}
  .tool{height:68px;font-size:14px}.tool svg{width:40px;height:40px}
  .qchoices button{width:110px;height:110px}
}
@media (prefers-reduced-motion:reduce){
  button{transition:none}
  .qchoices button.hint,.qmic.listening{animation:none;outline:5px solid var(--pop)}
  .confetti i{animation-duration:.01s}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="pdefs"></defs></svg>

<div class="app">
  <div class="top" id="tabs">
    <button class="tab" data-view="dress" aria-label="Dress up"><svg viewBox="0 0 40 40"><path d="M14,5 L26,5 L28,14 L24,17 L34,35 L6,35 L16,17 L12,14Z" fill="#FF6DB0" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>Dress</button>
    <button class="tab" data-view="face" aria-label="Makeup"><svg viewBox="0 0 40 40"><circle cx="20" cy="21" r="15" fill="#D9A07A" stroke="currentColor" stroke-width="2.5"/><circle cx="14" cy="18" r="2.4" fill="currentColor"/><circle cx="26" cy="18" r="2.4" fill="currentColor"/><circle cx="11" cy="24" r="3" fill="#FF6DB0" opacity=".7"/><circle cx="29" cy="24" r="3" fill="#FF6DB0" opacity=".7"/><path d="M15,27 Q20,32 25,27 Q20,29 15,27Z" fill="#EE3B45" stroke="currentColor" stroke-width="2"/></svg>Face</button>
    <button class="tab" data-view="nails" aria-label="Nails"><svg viewBox="0 0 40 40"><g fill="#D9A07A" stroke="currentColor" stroke-width="2.3"><rect x="8" y="9" width="6" height="18" rx="3"/><rect x="15" y="5" width="6" height="20" rx="3"/><rect x="22" y="7" width="6" height="18" rx="3"/><rect x="7" y="18" width="24" height="17" rx="7"/></g><g fill="#FF6DB0" stroke="currentColor" stroke-width="1.2"><rect x="9.2" y="6" width="3.6" height="6" rx="1.8"/><rect x="16.2" y="2" width="3.6" height="6" rx="1.8"/><rect x="23.2" y="4" width="3.6" height="6" rx="1.8"/></g></svg>Nails</button>
    <button class="tab" data-view="me" aria-label="Me"><svg viewBox="0 0 40 40"><g fill="#3A2418"><circle cx="20" cy="17" r="13"/><circle cx="9" cy="12" r="6"/><circle cx="31" cy="12" r="6"/><circle cx="20" cy="5" r="6"/></g><circle cx="20" cy="21" r="10" fill="#C98D62" stroke="currentColor" stroke-width="2.3"/><circle cx="16.5" cy="21" r="1.8" fill="currentColor"/><circle cx="23.5" cy="21" r="1.8" fill="currentColor"/><path d="M17,25 Q20,28 23,25" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Me</button>
    <button class="ib" id="undoBtn" aria-label="Undo"><svg viewBox="0 0 44 44"><path d="M15,11 L7,19 L15,27 M8,19 H27 C33,19 37,23 37,28 C37,33 33,36 28,36 H21" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ib" id="gearBtn" aria-label="Grown-up settings"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="7" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M22,5 V11 M22,33 V39 M5,22 H11 M33,22 H39 M10,10 L14,14 M30,30 L34,34 M34,10 L30,14 M14,30 L10,34" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></button>
  </div>

  <div class="main">
    <div class="stagebox"><svg id="stage" viewBox="0 0 300 560" preserveAspectRatio="xMidYMid meet" aria-label="Zahra's girl"></svg></div>
    <div class="panel" id="panel">
      <div class="rows" id="rows"></div>
      <div class="quiz" id="quiz" hidden>
        <div class="qrow"><button class="qhear" id="qHear" aria-label="Hear the question again"><svg viewBox="0 0 40 40"><path d="M8,16 H14 L22,9 V31 L14,24 H8Z" fill="currentColor"/><path d="M27,14 Q31,20 27,26 M31,10 Q38,20 31,30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button><div class="qprompt" id="qPrompt"></div></div>
        <div class="qvis" id="qVis"></div>
        <div class="qchoices" id="qChoices"></div>
        <button class="qmic" id="qMic" hidden><svg viewBox="0 0 40 40"><rect x="14" y="5" width="12" height="20" rx="6" fill="currentColor"/><path d="M9,19 Q9,31 20,31 Q31,31 31,19 M20,31 V37" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span id="qMicLbl">Say it!</span></button>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-labelledby="sheetH">
    <h2 id="sheetH">For grown-ups</h2>
    <p>While she dresses up, a question pops up now and then: a color, a number, a shape, or the next letter in ZAHRA. She answers by tapping, or by pressing the microphone and saying it out loud. Get it right and the new thing goes on.</p>
    <div class="lbl">Questions</div>
    <div class="seg" id="segQuiz"><button data-q="off">Off</button><button data-q="some">Some</button><button data-q="lots">Lots</button></div>
    <div class="lbl">Voice</div>
    <div class="seg" id="segVoice"><button data-v="1">On</button><button data-v="0">Off</button></div>
    <p id="micNote"></p>
    <div class="seg"><button id="resetBtn">Start over</button><button id="closeSheet">Done</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const INK='#3B1F4A';
const COLORS=[['Red','#EE3B45'],['Orange','#FF8C26'],['Yellow','#FFD02E'],['Green','#36B65A'],['Blue','#2F86E8'],['Purple','#8D58D8'],['Pink','#FF6DB0'],['White','#FFFFFF'],['Black','#34303A'],['Brown','#8B5A3C']];
const CI=n=>COLORS.findIndex(c=>c[0]===n);
const PATS=[['plain','Plain'],['dots','Dots'],['stripes','Stripes'],['stars','Stars'],['hearts','Hearts'],['sparkle','Sparkle'],['checks','Checks']];
const PATN=Object.fromEntries(PATS);
const SKINS=['#F4D3BA','#E3B18C','#C98D62','#A86C45','#82502F','#5C3722'];
const HAIRC=[['Black','#1F1513'],['Dark brown','#3A2418'],['Brown','#6A3F24'],['Caramel','#A86A3A'],['Auburn','#8E3B22'],['Blonde','#D8A657']];
const HAIRS=[['curly','Curly'],['puffs','Puffs'],['long','Long curls'],['braids','Braids'],['puff','Top puff'],['bun','Bun']];
const HAIRMETA={curly:[30,1.28],puffs:[52,1.04],long:[46,1.1],braids:[52,1.04],puff:[50,1.04],bun:[52,1.04]};
const NAME=['Z','A','H','R','A'];
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const f1=n=>Math.round(n*10)/10;
const $=s=>document.querySelector(s);

// ---------- paint & patterns ----------
function starPath(){let d='';for(let i=0;i<10;i++){const r=i%2?0.21:0.5,a=-Math.PI/2+i*Math.PI/5;d+=(i?'L':'M')+f1(r*Math.cos(a)*100)/100+','+f1((r*Math.sin(a)+0.04)*100)/100;}return d+'Z';}
const UNIT={
  star:starPath(),
  heart:'M0,0.44 C-0.66,0.02 -0.52,-0.56 0,-0.2 C0.52,-0.56 0.66,0.02 0,0.44Z',
  square:'M-0.42,-0.42H0.42V0.42H-0.42Z',
  triangle:'M0,-0.46L0.5,0.42H-0.5Z',
  circle:'M0.46,0 A0.46,0.46 0 1 1 -0.46,0 A0.46,0.46 0 1 1 0.46,0Z'
};
const defs=document.getElementById('pdefs');
function motif(ci){const n=COLORS[ci]?COLORS[ci][0]:'';return n==='White'?'#FF6DB0':n==='Yellow'?'#FF8C26':'#FFFFFF';}
function paint(ci,p,size=18){
  const c=COLORS[ci][1]; if(!p||p==='plain') return c;
  const id=`p-${p}-${ci}-${size}`;
  if(!document.getElementById(id)){
    const m=motif(ci),s=size,h=s/2; let inner='',rot='';
    const tw=(v,d)=>RM?'':`<animate attributeName="opacity" values="${v}" dur="${d}s" repeatCount="indefinite"/>`;
    if(p==='dots') inner=`<circle cx="${h}" cy="${h}" r="${s*.2}" fill="${m}"/>`;
    else if(p==='stripes'){inner=`<rect width="${s*.42}" height="${s}" fill="${m}"/>`;rot=' patternTransform="rotate(45)"';}
    else if(p==='stars'||p==='hearts') inner=`<path d="${UNIT[p==='stars'?'star':'heart']}" transform="translate(${h},${h}) scale(${s*.62})" fill="${m}"/>`;
    else if(p==='sparkle'){const g=m==='#FFFFFF'?'#FFF2A0':m;
      inner=`<circle cx="${s*.2}" cy="${s*.25}" r="${s*.07}" fill="#fff"/><circle cx="${s*.72}" cy="${s*.16}" r="${s*.05}" fill="${g}"/><circle cx="${s*.55}" cy="${s*.6}" r="${s*.08}" fill="#fff">${tw('1;.15;1',1.4)}</circle><circle cx="${s*.15}" cy="${s*.8}" r="${s*.05}" fill="${g}"/><path d="M${s*.85},${s*.62} l${s*.07},${s*.11} l-${s*.07},${s*.11} l-${s*.07},-${s*.11}Z" fill="#fff">${tw('.2;1;.2',1.1)}</path>`;}
    else if(p==='checks') inner=`<rect y="${s*.3}" width="${s}" height="${s*.4}" fill="${INK}" opacity=".2"/><rect x="${s*.3}" width="${s*.4}" height="${s}" fill="${INK}" opacity=".2"/><rect y="${s*.48}" width="${s}" height="${s*.05}" fill="#fff" opacity=".7"/><rect x="${s*.48}" width="${s*.05}" height="${s}" fill="#fff" opacity=".7"/>`;
    defs.insertAdjacentHTML('beforeend',`<pattern id="${id}" width="${s}" height="${s}" patternUnits="userSpaceOnUse"${rot}><rect width="${s}" height="${s}" fill="${c}"/>${inner}</pattern>`);
  }
  return `url(#${id})`;
}

// ---------- drawing helpers ----------
const sh=(d,p,sw=4)=>`<path d="${d}" fill="${p}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const uni=(shapes,p,sw=7)=>`<g fill="${INK}" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round">${shapes}</g><g fill="${p}">${shapes}</g>`;
const uniU=(s,p)=>uni(s,p,0.09);
const limb=(pts,w,p)=>{const d='M'+pts.map(q=>q.join(',')).join(' L');return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+8}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${p}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;};
const line=(d,c,w)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const mir=s=>`<g transform="matrix(-1 0 0 1 300 0)">${s}</g>`;
const both=s=>s+mir(s);
const circ=(x,y,r)=>`<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}"/>`;
function cloud(cx,cy,r,b,n){let s=circ(cx,cy,r);for(let i=0;i<n;i++){const a=i/n*Math.PI*2;s+=circ(cx+r*Math.cos(a),cy+r*Math.sin(a),b);}return s;}
const at=(x,y,sc,inner,rot=0)=>`<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${sc})">${inner}</g>`;
const sk=()=>SKINS[S.look.skin]||SKINS[2];
const mm=o=>(o&&o.c===CI('Yellow'))?'#FF8C26':'#FFD02E';
const ctr=o=>(o&&o.c===CI('Yellow'))?'#FF8C26':'#FFD02E';

// ---------- little pictures (unit size, centred on 0,0) ----------
const ICONS={
  heart:p=>uniU(`<path d="${UNIT.heart}"/>`,p),
  star:p=>uniU(`<path d="${UNIT.star}"/>`,p),
  circle:p=>uniU(`<path d="${UNIT.circle}"/>`,p),
  square:p=>uniU(`<path d="${UNIT.square}"/>`,p),
  triangle:p=>uniU(`<path d="${UNIT.triangle}"/>`,p),
  butterfly:p=>uniU('<ellipse cx="-0.22" cy="-0.14" rx="0.21" ry="0.18"/><ellipse cx="0.22" cy="-0.14" rx="0.21" ry="0.18"/><ellipse cx="-0.17" cy="0.17" rx="0.15" ry="0.13"/><ellipse cx="0.17" cy="0.17" rx="0.15" ry="0.13"/>',p)
    +`<circle cx="-0.24" cy="-0.15" r="0.06" fill="#fff" opacity=".85"/><circle cx="0.24" cy="-0.15" r="0.06" fill="#fff" opacity=".85"/><ellipse cx="0" cy="0" rx="0.06" ry="0.3" fill="${INK}"/>`+line('M-0.03,-0.27 Q-0.1,-0.42 -0.19,-0.45 M0.03,-0.27 Q0.1,-0.42 0.19,-0.45',INK,0.045),
  rainbow:()=>{const b=[['#EE3B45',.4],['#FFD02E',.3],['#2F86E8',.2]];let o='',c='';b.forEach(([k,r])=>{const d=`M${-r},0.15 A${r},${r} 0 0 1 ${r},0.15`;o+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="0.16"/>`;c+=`<path d="${d}" fill="none" stroke="${k}" stroke-width="0.09"/>`;});return o+c+uniU(circ(-0.33,0.18,0.1)+circ(-0.22,0.2,0.08)+circ(0.33,0.18,0.1)+circ(0.22,0.2,0.08),'#FFFFFF');},

let ac=null,voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Samantha|Female|Google US English|Aria|Jenny|Zira/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice();}catch(e){}
function pop(hi){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type='sine';const f=hi?760:520+Math.random()*300;
  o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*2.2,ac.currentTime+.1);
  g.gain.setValueAtTime(.16,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.16);
  o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.17);}catch(e){}}
function say(t){if(!S.sound||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.2;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}}
function confetti(){const b=document.createElement('div');b.className='confetti';
  for(let i=0;i<44;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=COLORS[i%7][1];c.style.animationDelay=Math.random()*.5+'s';if(i%3===0)c.style.borderRadius='50%';b.appendChild(c);}
  document.body.appendChild(b);setTimeout(()=>b.remove(),2400);}

const FACE_TOOLS=[['lips','Lips',`<svg viewBox="0 0 44 44"><path d="M7,22 Q15,12 22,18 Q29,12 37,22 Q22,40 7,22Z" fill="#EE3B45" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/></svg>`],

// ---------- questions ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micOK=!!SR;
const NUMACC={1:['one','1','won'],2:['two','2','to','too'],3:['three','3','tree','free'],4:['four','4','for','fore'],5:['five','5'],6:['six','6','sticks'],7:['seven','7'],8:['eight','8','ate'],9:['nine','9'],10:['ten','10']};
const LETACC={Z:['z','zee','zed'],A:['a','ay','eh','hey','hay','aye'],H:['h','aitch','age','each','ach'],R:['r','are','our','ar'],B:['b','be','bee'],M:['m','em'],S:['s','es','ess'],O:['o','oh','owe'],T:['t','tea','tee'],K:['k','kay','okay']};
const SHAPEACC={circle:['circle','circles'],square:['square','squares'],triangle:['triangle','triangles','try angle'],star:['star','stars'],heart:['heart','hearts','hart']};
const colAcc=n=>({Purple:['purple','perple','burple'],Pink:['pink','pinky']}[n]||[n.toLowerCase()]);
const SHAPES=['circle','square','triangle','star','heart'];
const SHAPEC={circle:'#2F86E8',square:'#36B65A',triangle:'#FF8C26',star:'#FFD02E',heart:'#FF6DB0'};
let quizOpen=false,since=3;
function others(pool,ans,n){return shuffle(pool.filter(x=>x!==ans)).slice(0,n);}
function numChoices(ans,max){const pool=[];for(let i=1;i<=Math.max(max,ans+1);i++)pool.push(i);return shuffle([ans,...others(pool,ans,2)]);}
function numQ(ans,text,spoken,vis,max=5){
  return {text,spoken,vis,ans:String(ans),choices:numChoices(ans,max).map(n=>({k:String(n),html:String(n),name:NUMW[n],acc:NUMACC[n]})),right:NUMW[ans]+'!'};
}
function buildQuiz(meta){
  const kinds=['count','count','name','name','shape'];
  if(meta.c!=null)kinds.push('colorFind','colorFind','colorFind',micOK?'colorSay':'colorFind');
  if(meta.n)kinds.push('jersey','jersey','jersey');
  if(meta.nailC)kinds.push('nailCount','nailCount','nailCount');
  const k=pick(kinds),max=S.quiz==='lots'?6:5;
  if(k==='colorFind'){const a=meta.c,ch=shuffle([a,...others(COLORS.map((_,i)=>i),a,2)]);const n=COLORS[a][0];
    return {text:`Which one is ${n.toLowerCase()}?`,spoken:`Which one is ${n}?`,vis:meta.vis?meta.vis('#ECE4F0'):'',ans:String(a),right:`${n}!`,
      choices:ch.map(i=>({k:String(i),html:'',cls:'swc',style:`background:${COLORS[i][1]}`,name:COLORS[i][0],acc:colAcc(COLORS[i][0])}))};}
  if(k==='colorSay'){const a=meta.c,ch=shuffle([a,...others(COLORS.map((_,i)=>i),a,2)]);const n=COLORS[a][0];
    return {text:'What color is this?',spoken:'What color is this? Say it, or tap it!',vis:meta.vis?meta.vis(paint(a,'plain')):DROP(paint(a,'plain')),ans:String(a),right:`${n}!`,
      choices:ch.map(i=>({k:String(i),html:COLORS[i][0],cls:'word',name:COLORS[i][0],acc:colAcc(COLORS[i][0])}))};}
  if(k==='jersey'){const n=meta.n;return numQ(n,'What number is on your jersey?','What number is on your jersey?',`<svg viewBox="76 166 148 154" class="thing">${BY.jersey.draw(paint(meta.c!=null?meta.c:CI('Blue'),'plain'),{c:meta.c,n})}</svg>`,9);}
  if(k==='nailCount'){const n=Math.min(meta.nailC,10),cn=COLORS[meta.c][0];return numQ(n,`How many ${cn.toLowerCase()} nails?`,`How many ${cn} nails? Count them!`,`<div class="qprompt" style="font-size:18px">Count on the hands ↑</div>`,Math.max(5,n+1));}
  if(k==='name'){const i=Math.floor(Math.random()*5),a=NAME[i];
    const tiles=NAME.map((L,j)=>`<div class="tile${j===i?' q':j>i?' e':''}">${j<i?L:j===i?'?':'·'}</div>`).join('');
    const ch=shuffle([a,...others(['B','M','S','O','T','K'],a,2)]);
    return {text:i===0?'What letter does Zahra start with?':'What letter comes next?',spoken:i===0?'Zahra starts with which letter?':NAME.slice(0,i).join(', ')+'... what comes next?',vis:tiles,ans:a,right:i===4?'A! Z, A, H, R, A. Zahra!':a+'!',nameIdx:i,
      choices:ch.map(L=>({k:L,html:L,name:L,acc:LETACC[L]}))};}
  if(k==='shape'){const a=pick(SHAPES),ch=shuffle([a,...others(SHAPES,a,2)]);
    return {text:`Which one is the ${a}?`,spoken:`Which one is the ${a}?`,vis:'',ans:a,right:`The ${a}!`,
      choices:ch.map(s=>({k:s,html:iconSvg(s,SHAPEC[s]),name:'the '+s,acc:SHAPEACC[s]}))};}
  // count
  const [ic,plural,cn]=BG_COUNT[S.bg]||BG_COUNT.room,n=1+Math.floor(Math.random()*max);
  return numQ(n,`How many ${plural}?`,`How many ${plural}? Count them!`,Array.from({length:n},()=>iconSvg(ic,paint(CI(cn),'plain'),CI(cn),'cnt')).join(''),max);
}
let Q=null,onDone=null,wrongs=0,rec=null;
function startQuiz(meta,done){
  Q=buildQuiz(meta);onDone=done;wrongs=0;quizOpen=true;
  $('#qPrompt').textContent=Q.text;$('#qVis').innerHTML=Q.vis;
  $('#qChoices').innerHTML=Q.choices.map(c=>`<button data-k="${c.k}" class="${c.cls||''}" style="${c.style||''}" aria-label="${c.name}">${c.html}</button>`).join('');
  $('#qMic').hidden=!micOK;$('#qMicLbl').textContent='Say it!';
  $('#panel').classList.add('quizzing');$('#panel').scrollTop=0;$('#quiz').hidden=false;
  say(Q.spoken);
}
function finishQuiz(){quizOpen=false;stopRec();$('#quiz').hidden=true;$('#panel').classList.remove('quizzing');const d=onDone;onDone=null;Q=null;if(d)d();}
function answer(k){
  if(!Q)return;
  const btn=$(`#qChoices [data-k="${k}"]`),c=Q.choices.find(x=>x.k===k);
  if(k===Q.ans){
    btn&&btn.classList.add('yes');pop(true);confetti();
    if(Q.nameIdx!=null){const t=$('#qVis').children[Q.nameIdx];if(t){t.textContent=Q.ans;t.classList.remove('q');}}
    say('Yes! '+Q.right);const wait=Q.nameIdx===4?2400:1300;Q=null;setTimeout(finishQuiz,wait);
  } else {
    wrongs++;if(btn){btn.classList.remove('no');void btn.offsetWidth;btn.classList.add('no');}
    say(c?`That's ${c.name}. Try again!`:'Try again!');
    if(wrongs>=2){const r=$(`#qChoices [data-k="${Q.ans}"]`);r&&r.classList.add('hint');}
  }
}
$('#qChoices').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.classList.contains('no'))answer(b.dataset.k);});
$('#qHear').addEventListener('click',()=>Q&&say(Q.spoken));
function stopRec(){try{rec&&rec.abort();}catch(e){}rec=null;$('#qMic').classList.remove('listening');}
$('#qMic').addEventListener('click',()=>{
  if(!Q||!SR)return;if(rec){stopRec();return;}
  try{speechSynthesis.cancel();}catch(e){}
  try{rec=new SR();}catch(e){micOK=false;$('#qMic').hidden=true;return;}
  rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
  $('#qMic').classList.add('listening');$('#qMicLbl').textContent='Listening…';
  rec.onresult=e=>{
    const heard=' '+[...e.results[0]].map(a=>a.transcript.toLowerCase().replace(/[^a-z0-9 ]/g,' ')).join(' ')+' ';
    const hit=c=>c.acc&&c.acc.some(w=>heard.includes(' '+w+' '));
    const right=Q&&Q.choices.find(c=>c.k===Q.ans);
    if(right&&hit(right)){answer(right.k);return;}
    const other=Q&&Q.choices.find(hit);
    if(other)answer(other.k);else say("I didn't hear that. Try again!");
  };
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){micOK=false;$('#qMic').hidden=true;say('Tap your answer!');}};
  rec.onend=()=>{rec=null;$('#qMic').classList.remove('listening');$('#qMicLbl').textContent='Say it!';};
  try{rec.start();}catch(e){stopRec();}
});
function commit(fn){snap();fn();save();renderAll();}
function act(meta,fn){
  const p=S.quiz==='lots'?.55:S.quiz==='some'?.3:0;since++;
  if(p&&since>=2&&Math.random()<p){since=0;startQuiz(meta,()=>commit(fn));}else commit(fn);
}

// ---------- actions ----------
const outfitOf=slots=>slots.filter(s=>S.outfit[s]&&BY[S.outfit[s].id]);
function chooseCat(id){
  S.cat=id;const sl=CAT_SLOTS[id];
  if(sl){const w=outfitOf(sl);S.slotSel=w.includes(S.slotSel)?S.slotSel:(w[0]||null);if(S.slotSel){S.color=S.outfit[S.slotSel].c;S.pat=S.outfit[S.slotSel].p||'plain';}}
  renderPanel();renderTabs();
}
const itemVis=id=>p=>`<svg viewBox="${BY[id].vb}" class="thing">${BY[id].draw(p,{c:null,n:7})}</svg>`;
function wear(it){
  if(worn(it)){commit(()=>{delete S.outfit[it.slot];});say(it.name+' off');return;}
  const o={id:it.id,c:S.color,p:S.pat};if(it.id==='jersey')o.n=1+Math.floor(Math.random()*9);
  say(it.name);
  act({c:S.color,vis:itemVis(it.id),n:o.n},()=>{S.outfit[it.slot]=o;S.slotSel=it.slot;});
}
function recolor(){
  const sl=S.slotSel;
  if(S.view==='dress'&&sl&&S.outfit[sl]&&(CAT_SLOTS[S.cat]||[]).includes(sl)){
    const id=S.outfit[sl].id;
    act({c:S.color,vis:itemVis(id),n:S.outfit[sl].n},()=>{S.outfit[sl]=Object.assign({},S.outfit[sl],{c:S.color,p:S.pat});});
  } else renderPanel();
}
function theme(k){
  if(k==='home'){commit(()=>{S.bg='room';});say('My room');return;}
  const t=THEMES[k];say(t.name+'!');
  act({c:CI(t.outfit.top[1]),vis:itemVis(t.icon[0]),n:k==='soccer'?1+Math.floor(Math.random()*9):undefined},()=>{
    S.bg=t.bg;S.outfit={};Object.entries(t.outfit).forEach(([sl,[id,cn,p]])=>{S.outfit[sl]={id,c:CI(cn),p};});
    if(S.outfit.top&&S.outfit.top.id==='jersey')S.outfit.top.n=1+Math.floor(Math.random()*9);
  });
  if(!quizOpen)confetti();
}
function makeup(part){
  const nm={lips:'Lips',cheeks:'Cheeks',eyes:'Eyes'}[part];
  act({c:S.color},()=>{S.makeup[part]=S.color;});say(COLORS[S.color][0]+' '+nm.toLowerCase());
}
function paintNail(i){
  const c=S.color,before=S.nails.filter(Boolean).length,had=!!S.nails[i];
  const same=S.nails.filter((n,j)=>n&&n.c===c&&j!==i).length+1;
  act({c,vis:p=>`<svg viewBox="-22 -36 44 80" class="thing">${nailSvg({s:S.nailShape,c,p:'plain'},0,0,0,p)}</svg>`,nailC:same>=2?same:null},()=>{
    S.nails[i]={s:S.nailShape,c,p:S.pat};
  });
  if(!quizOpen){const n=S.nails.filter(Boolean).length;if(!had&&n===10){confetti();say('Ten! All ten nails!');}else if(!had)say(NUMW[n]+'!');else pop();}
}
function stampAt(list,x,y,size){
  const st={k:S.stamp,c:S.color,x:f1(x),y:f1(y),s:size,r:f1((Math.random()-.5)*30)};
  act({c:S.color,vis:p=>iconSvg(S.stamp,p,S.color,'thing')},()=>{S[list].push(st);});
  say((STICKERS.find(s=>s[0]===S.stamp)||['',''])[1]);
}

// ---------- taps on the picture ----------
function svgPt(e){const pt=stage.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=stage.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:-999,y:-999};}
const dist=(a,b,x,y)=>Math.hypot(a-x,b-y);
stage.addEventListener('click',e=>{
  if(quizOpen)return;const {x,y}=svgPt(e);
  if(S.view==='dress'||S.view==='me'){
    if(S.view==='me')return;
    if(dist(x,y,90,330)<28||dist(x,y,210,330)<28){S.view='nails';renderAll();say('Nails!');return;}
    if(dist(x,y,150,124)<54&&y>94){S.view='face';renderAll();say('Makeup!');return;}
    let c=null;
    if(y<100||(dist(x,y,150,110)<96&&y<168))c=S.cat==='hats'?'hair':'hats';
    else if(y<206&&Math.abs(x-150)<34)c='jewelry';
    else if(y<306&&x>96&&x<204)c=S.cat==='tops'?'coats':'tops';
    else if(y<445&&x>96&&x<204)c=S.cat==='bottoms'?'socks':'bottoms';
    else if(y<525&&x>90&&x<210)c=S.cat==='shoes'?'socks':'shoes';
    else if(x>200&&y>100)c='extras';
    if(c){pop();chooseCat(c);say(CATN[c]);}
    return;
  }
  if(S.view==='face'){
    if(S.faceTool==='stickers'){stampAt('faceStamps',x,y,24);return;}
    let part=null;
    if(dist(x,y,150,159)<20)part='lips';
    else if(dist(x,y,112,146)<20||dist(x,y,188,146)<20)part='cheeks';
    else if(dist(x,y,128,118)<20||dist(x,y,172,118)<20)part='eyes';
    if(part&&part!==S.faceTool){S.faceTool=part;renderPanel();}
    if(part||dist(x,y,150,120)<62)makeup(part||S.faceTool);
    return;
  }
  if(S.view==='nails'){
    if(S.nailTool==='tattoos'){stampAt('handStamps',x,y,54);return;}
    const cs=nailCenters();let best=-1,bd=1e9;cs.forEach(([cx,cy],i)=>{const d=dist(x,y,cx,cy);if(d<bd){bd=d;best=i;}});
    if(bd<46)paintNail(best);
  }
});

document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;S.view=b.dataset.view;renderAll();pop();say({dress:'Dress up!',face:'Makeup!',nails:'Nails!',me:'This is me!'}[S.view]);});
$('#rows').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||quizOpen)return;const d=b.dataset;
  if(d.cat){pop();chooseCat(d.cat);say(CATN[d.cat]);return;}
  if(d.theme){theme(d.theme);return;}
  if(d.item){pop();wear(BY[d.item]);return;}
  if(d.off){const sl=S.slotSel&&(CAT_SLOTS[S.cat]||[]).includes(S.slotSel)?S.slotSel:outfitOf(CAT_SLOTS[S.cat]||[])[0];if(sl){commit(()=>{delete S.outfit[sl];});S.slotSel=outfitOf(CAT_SLOTS[S.cat])[0]||null;pop();say('Off!');}return;}
  if(d.color!==undefined){S.color=+d.color;pop();say(COLORS[S.color][0]);
    if(S.view==='face'&&S.faceTool!=='stickers'){makeup(S.faceTool);return;}
    if(S.view==='dress'){recolor();return;} renderPanel();return;}
  if(d.pat){S.pat=d.pat;pop();say(PATN[d.pat]);if(S.view==='dress'){recolor();return;}renderPanel();return;}
  if(d.ftool){S.faceTool=d.ftool;pop();say(FACE_TOOLS.find(t=>t[0]===d.ftool)[1]);renderPanel();return;}
  if(d.fwipe){pop();if(S.faceTool==='stickers'){if(S.faceStamps.length)commit(()=>S.faceStamps.pop());}else commit(()=>{S.makeup[S.faceTool]=null;});say('Wiped off!');return;}
  if(d.stamp){S.stamp=d.stamp;pop();say((STICKERS.find(s=>s[0]===d.stamp)||['',''])[1]+'. Tap to stick it on!');renderPanel();return;}
  if(d.ntool){S.nailTool=d.ntool;pop();say(d.ntool==='nails'?'Nails':'Tattoos. Tap a hand!');renderPanel();return;}
  if(d.shape){S.nailShape=d.shape;pop();say(NSHAPES.find(s=>s[0]===d.shape)[1]+' nails');renderPanel();return;}
  if(d.allnails){const c=S.color;act({c,vis:p=>DROP(p)},()=>{S.nails=S.nails.map(()=>({s:S.nailShape,c,p:S.pat}));});if(!quizOpen){confetti();say('One, two, three, four, five, six, seven, eight, nine, ten!');}return;}
  if(d.nwipe){pop();if(S.nailTool==='tattoos'){if(S.handStamps.length)commit(()=>S.handStamps.pop());}else commit(()=>{S.nails=Array(10).fill(null);});say('All off!');return;}
  if(d.skin!==undefined){pop();commit(()=>{S.look.skin=+d.skin;});return;}
  if(d.hair){pop();commit(()=>{S.look.hair=d.hair;});say(HAIRS.find(h=>h[0]===d.hair)[1]);return;}
  if(d.hairc!==undefined){pop();commit(()=>{S.look.hairC=+d.hairc;});say(HAIRC[+d.hairc][0]+' hair');return;}
});
$('#undoBtn').addEventListener('click',()=>{if(!quizOpen)undo();});

// grown-up sheet
function renderSheet(){
  document.querySelectorAll('#segQuiz button').forEach(b=>b.classList.toggle('on',b.dataset.q===S.quiz));
  document.querySelectorAll('#segVoice button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===S.sound));
  $('#micNote').textContent=micOK?'Talking answers: the first time she presses the microphone, the browser asks to use it.':'Talking answers are not available in this browser, so she answers by tapping. Chrome or Safari on a phone or tablet supports them.';
}
$('#gearBtn').addEventListener('click',()=>{renderSheet();$('#sheet').hidden=false;});
$('#closeSheet').addEventListener('click',()=>{$('#sheet').hidden=true;});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true;});
$('#segQuiz').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.quiz=b.dataset.q;save();renderSheet();});
$('#segVoice').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.sound=b.dataset.v==='1';try{speechSynthesis.cancel();}catch(_){}save();renderSheet();});
let armT=null;
$('#resetBtn').addEventListener('click',()=>{const b=$('#resetBtn');
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again';clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='Start over';},2500);return;}
  clearTimeout(armT);b.classList.remove('armed');b.textContent='Start over';
  commit(()=>{const f=fresh();f.look=S.look;Object.assign(S,f);});$('#sheet').hidden=true;});

// ---------- go ----------
load();renderAll();
(document.fonts&&document.fonts.ready||Promise.resolve()).then(()=>renderStage()).catch(()=>{});
})();
</script>
